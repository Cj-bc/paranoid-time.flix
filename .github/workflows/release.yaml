name: Release

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: tag name to release
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  TAG_NAME: ${{ case (
    github.event_name == 'push', github.ref_name,
    github.event.inputs.tagName) }}

# Avoid two release runs racing for the same tag; never cancel a run
# that may already be mid-publish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Reuse the same check/test job that PRs and pushes to master run,
  # instead of duplicating those steps here.
  build-and-test:
    uses: ./.github/workflows/build-and-test.yaml

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    # `flix release` only needs to create a GitHub Release and upload the
    # built artifact to it, so the auto-issued GITHUB_TOKEN only needs
    # `contents: write`. Everything else defaults to `none` because this
    # block is explicit.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Verify tag matches flix.toml version
        run: |
          tag_version="${TAG_NAME#v}"
          toml_version=$(grep '^version' flix.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$tag_version" != "$toml_version" ]; then
            echo "::error::Tag $TAG_NAME does not match flix.toml version ($toml_version)"
            exit 1
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo y | nix develop -c flix release --github-token "$GITHUB_TOKEN"
