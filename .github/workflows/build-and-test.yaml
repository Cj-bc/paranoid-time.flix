name: Build and Test

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Check
        run: nix develop -c flix check

      - name: Test
        run: nix develop -c flix test
